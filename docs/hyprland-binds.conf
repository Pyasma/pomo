# Pomodoro (pomo)
bindd = SUPER ALT, P, Pomodoro start/pause, exec, $HOME/.local/bin/pomo toggle
bindd = SUPER ALT, M, Pomodoro panel, exec, omarchy-launch-or-focus-tui $HOME/.local/bin/pomo tui

# The panel is a small floating terminal, not a tiled window.
windowrule = match:class org.omarchy.pomo, float 1
windowrule = match:class org.omarchy.pomo, size 980 660
windowrule = match:class org.omarchy.pomo, center 1
# opaque: the panel is a reading surface, not a glass overlay
windowrule = match:class org.omarchy.pomo, opacity 1 override 1 override
